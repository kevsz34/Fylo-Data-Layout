<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fylo Data Storage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <article id="firstSect">

            <section id="logoName"><img src="images/logo.svg" alt=" Fylo Logo"></section>

            <section id="images">
                <button><img src="images/icon-document.svg" alt=""></button>
                <button><img src="images/icon-folder.svg" alt=""></button>
                <button><img src="images/icon-upload.svg" alt=""></button>
            </section>

        </article>

        <article id="secondSect">
            <section><h2>You've used <span>815 GB</span> of your storage</h2></section>
            <section id="bar"><div id="barProg"><div id="circle"></div></div></section>
            <section id="maxMin"><p>0 GB</p> <p>1000 GB</p></section>
            <div id="popup"><p><span>185</span> GB LEFT</p></div>
            <div id="popupArrow"><div id="cut"></div></div>
        </article>
    </div>
    <script src="script.js"></script>
</body>
</html>
